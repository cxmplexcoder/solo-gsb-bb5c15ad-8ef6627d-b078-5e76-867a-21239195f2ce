services:
  resolver:
    build: .
    image: dep-resolver:latest
    container_name: dep-resolver
    ports:
      # 宿主机 8080 -> 容器 8080（如需改宿主机端口，改冒号左侧即可）
      - "8080:8080"
    environment:
      DATABASE_PATH: /data/resolutions.db
      SOLVER_MAX_ATTEMPTS: "100000"
    volumes:
      # SQLite 数据持久化到命名卷；删除容器后解析缓存仍保留
      - resolver-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  resolver-data:
